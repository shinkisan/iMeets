[package]
name = "pocket-meets-shell"
version = "1.1.0"
edition = "2021"
description = "Pocket Meets shell around the MIT tg18-emu core"
license = "GPL-3.0-or-later"
publish = false

[lib]
name = "pocket_meets"
crate-type = ["staticlib", "rlib"]

[dependencies]
tg18 = { package = "tg18-core", path = "../../third_party/nijiiro-egg/core" }
miniz_oxide = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
